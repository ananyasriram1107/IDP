<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PYQ · Log in</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="sidebar-brand-mark">P</div>
        <div>
          <div class="sidebar-brand-title">PYQ</div>
          <div class="sidebar-brand-subtitle">JEE preparation</div>
        </div>
      </div>

      <h1 class="auth-title">Welcome</h1>
      <p class="auth-subtitle" id="authSubtitle">Log in to continue your JEE prep.</p>

      <div class="auth-tabs">
        <button type="button" class="auth-tab" data-mode="login">Log in</button>
        <button type="button" class="auth-tab" data-mode="signup">Sign up</button>
      </div>

      <form id="authForm" data-mode="login">
        <div class="auth-field">
          <label class="auth-label" for="authName">Name</label>
          <input class="auth-input" type="text" id="authName" placeholder="e.g. Aarav" autocomplete="name" required />
        </div>
        <div class="auth-field">
          <label class="auth-label" for="authPassword">Password</label>
          <input class="auth-input" type="password" id="authPassword" placeholder="••••••••" autocomplete="current-password" required />
        </div>
        <p class="auth-error" id="authError"></p>
        <button type="submit" class="btn btn-primary auth-submit" id="authSubmit">Log in</button>
      </form>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
