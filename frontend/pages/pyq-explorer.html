<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PYQ · Explorer</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
</head>
<body data-page="pyq-explorer">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-mark">P</div>
        <div>
          <div class="sidebar-brand-title">PYQ</div>
          <div class="sidebar-brand-subtitle">JEE preparation</div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a class="sidebar-link" data-nav-page="home" href="home.html" data-tooltip="Learning World" aria-label="Learning World">
          <span class="sidebar-link-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><polygon points="16 8 14 14 8 16 10 10 16 8"/></svg>
          </span>
          <span class="sr-only">Learning World</span>
        </a>
        <a class="sidebar-link" data-nav-page="materials" href="materials.html" data-tooltip="My Materials" aria-label="My Materials">
          <span class="sidebar-link-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          </span>
          <span class="sr-only">My Materials</span>
        </a>
        <a class="sidebar-link" data-nav-page="learn" href="learn.html" data-tooltip="Learn" aria-label="Learn">
          <span class="sidebar-link-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4L12 3z"/></svg>
          </span>
          <span class="sr-only">Learn</span>
        </a>
        <a class="sidebar-link" data-nav-page="pyq-explorer" href="pyq-explorer.html" data-tooltip="PYQ Explorer" aria-label="PYQ Explorer">
          <span class="sidebar-link-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          </span>
          <span class="sr-only">PYQ Explorer</span>
        </a>
        <a class="sidebar-link" data-nav-page="progress" href="progress.html" data-tooltip="My Progress" aria-label="My Progress">
          <span class="sidebar-link-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>
          </span>
          <span class="sr-only">My Progress</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <a class="sidebar-user" href="profile.html" data-tooltip="Profile" aria-label="Profile">
          <span class="sidebar-user-avatar" data-user-initials>?</span>
          <span class="sidebar-user-name sr-only" data-user-name>there</span>
        </a>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <h1 class="topbar-greeting">PYQ Explorer</h1>
          <p class="topbar-subtitle">Select a subject, topic, year, or difficulty to retrieve real stored questions.</p>
        </div>
      </div>

      <section id="explorerList">
        <div class="filter-row">
          <input class="filter-select" type="search" id="explorerSearch" placeholder="Search question text..." style="min-width:220px;" />
          <select class="filter-select" id="explorerSubject"><option value="">All subjects</option></select>
          <select class="filter-select" id="explorerTopic"><option value="">All topics</option></select>
          <select class="filter-select" id="explorerYear"><option value="">All years</option></select>
          <select class="filter-select" id="explorerDifficulty">
            <option value="">Any difficulty</option>
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
          </select>
        </div>
        <p class="intelligence-status" id="explorerStatus"></p>
        <div class="question-grid" id="explorerResults"></div>
      </section>

      <section id="explorerDetail" hidden>
        <button class="card-link" type="button" id="explorerBackButton" style="margin-bottom:14px;">&larr; Back to results</button>
        <div class="card" style="margin-bottom:20px;">
          <div id="detailDnaChips" style="margin-bottom:10px;"></div>
          <p id="detailText" style="font-size:14.5px;line-height:1.7;"></p>
          <p class="progress-card-subtitle" id="detailSource" style="margin-top:14px;"></p>
        </div>
        <section class="card">
          <div class="card-header"><h3 class="card-title">Related questions</h3></div>
          <ul class="recent-list" id="detailRelated"></ul>
        </section>
      </section>
    </main>
  </div>

  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/pyq-explorer.js"></script>
</body>
</html>
